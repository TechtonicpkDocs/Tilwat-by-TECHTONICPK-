plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pk.techtonic.tilawa'
    compileSdk 34

    defaultConfig {
        applicationId "pk.techtonic.tilawa"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Ship native libs for ARM phones only (arm64-v8a + armeabi-v7a
        // cover virtually every Android phone in Pakistan). Keeps the
        // ONNX Runtime .so files out of x86/x86_64 slices.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Extract native libs at install time instead of loading them mmap'd
    // from the APK. Removes any page-alignment dependency on every
    // device/Android version.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Stable debug signing: ONE debug keystore for all CI runs, committed
    // at repo root as debug.keystore (base64 text; the workflow decodes it
    // to ~/.android/debug.keystore before the build). Standard debug
    // credentials (android/android/androiddebugkey). DEBUG ONLY.
    signingConfigs {
        debug {
            storeFile new File(System.getProperty("user.home"), ".android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // ONNX Runtime Android — pinned to 1.30.0 to match the runtime Tilawa
    // itself targets (tilawa.dev v1 manifest: ort 1.30.0). Full package
    // (not -mobile): the streaming Zipformer model needs the full op set.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}
